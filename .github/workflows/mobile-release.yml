name: 移动端构建与发布

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: '已有版本标签；留空只构建，不发布 Release'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: mobile-release-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.38.9'
  WEATHER_API_BASE: ${{ vars.WEATHER_API_BASE }}
  WEATHER_SITE_URL: ${{ vars.WEATHER_SITE_URL }}

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: 核对版本和提交
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.meta.outputs.commit }}
      tag: ${{ steps.meta.outputs.tag }}
      prefix: ${{ steps.meta.outputs.prefix }}
      publish: ${{ steps.meta.outputs.publish }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: 检查打包辅助脚本
        run: python3 -m unittest discover -s tools -p test_mobile_release.py -v
      - name: 校验标签和服务地址
        id: meta
        env:
          RELEASE_TAG: ${{ inputs.release_tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: python3 tools/mobile_release.py prepare

  verify:
    name: Flutter 分析和回归
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub -r expanded

  android:
    name: Android 调试 APK
    needs: [prepare, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            mobile/android/**/*.gradle.kts
            mobile/android/gradle/wrapper/gradle-wrapper.properties
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: 恢复可选的固定调试签名
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$ANDROID_DEBUG_KEYSTORE_BASE64" ]]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
          fi
      - run: flutter pub get --enforce-lockfile
      - name: 从普通应用入口构建
        run: |
          flutter build apk --debug --no-pub --target lib/main.dart \
            --dart-define="WEATHER_API_BASE=$WEATHER_API_BASE" \
            --dart-define="WEATHER_SITE_URL=$WEATHER_SITE_URL"
      - name: 整理 APK
        env:
          PREFIX: ${{ needs.prepare.outputs.prefix }}
        run: |
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-debug.apk "../dist/$PREFIX-Android-Debug.apk"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mobile-package-android
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: 清理临时调试签名
        if: always()
        run: rm -f "$HOME/.android/debug.keystore"

  ios:
    name: iOS 模拟器和未签名设备包
    needs: [prepare, verify]
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    env:
      PREFIX: ${{ needs.prepare.outputs.prefix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: 记录工具链
        run: |
          flutter --version
          xcodebuild -version
          pod --version
      - run: flutter pub get --enforce-lockfile
      - name: 构建并归档模拟器应用
        run: |
          flutter build ios --simulator --debug --no-codesign --no-pub --target lib/main.dart \
            --dart-define="WEATHER_API_BASE=$WEATHER_API_BASE" \
            --dart-define="WEATHER_SITE_URL=$WEATHER_SITE_URL"
          mkdir -p ../dist
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphonesimulator/Runner.app \
            "../dist/$PREFIX-iOS-Simulator-Debug.app.zip"
      - name: 构建并归档未签名设备应用
        run: |
          flutter build ios --release --no-codesign --no-pub --target lib/main.dart \
            --dart-define="WEATHER_API_BASE=$WEATHER_API_BASE" \
            --dart-define="WEATHER_SITE_URL=$WEATHER_SITE_URL"
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app \
            "../dist/$PREFIX-iOS-Device-Release-Unsigned.app.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mobile-package-ios
          path: dist/*.app.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    name: 校验产物并发布 Release
    needs: [prepare, android, ios]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      EXPECTED_COMMIT: ${{ needs.prepare.outputs.commit }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mobile-package-*
          merge-multiple: true
          path: dist
      - name: 校验归档并生成清单和发布说明
        run: python3 tools/mobile_release.py manifest
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mobile-release-verified
          path: dist/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: 发布已有标签的全部产物
        if: needs.prepare.outputs.publish == 'true'
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          actual_commit="$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)"
          if [[ "$actual_commit" != "$EXPECTED_COMMIT" ]]; then
            echo '构建期间标签目标发生变化，拒绝发布。' >&2
            exit 1
          fi
          # 上传期间保持草稿；已公开版本不覆盖，避免替换用户下载过的文件。
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > release-state.txt; then
            if [[ "$(cat release-state.txt)" != true ]]; then
              echo '该标签已公开发布；请递增版本／构建号并使用新标签。' >&2
              exit 1
            fi
          else
            args=(--verify-tag --draft --title "Weather Atlas $RELEASE_TAG" --notes-file dist/RELEASE-NOTES.md)
            if [[ "$PRERELEASE" == true ]]; then args+=(--prerelease); fi
            gh release create "$RELEASE_TAG" "${args[@]}"
          fi
          gh release upload "$RELEASE_TAG" dist/*.apk dist/*.app.zip dist/SHA256SUMS dist/BUILD-MANIFEST.json --clobber
          gh release edit "$RELEASE_TAG" --draft=false --notes-file dist/RELEASE-NOTES.md
